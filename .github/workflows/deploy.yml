name: Deploy to Vercel

on:
  workflow_call:
    inputs:
      deploy:
        description: Deployment decision produced by Quality Checks
        required: true
        type: boolean
      branch:
        description: Branch associated with the deployment commit
        required: true
        type: string
      sha:
        description: Commit SHA to deploy
        required: true
        type: string

concurrency:
  group: vercel-deploy-${{ inputs.branch }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
  NEXT_PUBLIC_CLERK_SIGN_IN_URL: "/sign-in"
  NEXT_PUBLIC_CLERK_SIGN_UP_URL: "/sign-up"
  BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
  GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
  GEOSCAPE_API_KEY: ${{ secrets.GEOSCAPE_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  BUSINESS_EMAIL: "info@royalconstructions.com.au"
  BUSINESS_ADMIN_EMAIL: "admin@royalconstructions.com.au"
  GRAPH_SENDER_UPN: "info@royalconstructions.com.au"
  GRAPH_ADMIN_SENDER_UPN: "admin@royalconstructions.com.au"
  GRAPH_ADMIN_MAIL_CC: "nabeel.wasif+admin@uprez.net"
  GRAPH_MODE: "app-only"
  WEBHOOK_PATH: "/api/graph/notifications"
  WEBHOOK_PORT: "3000"
  GRAPH_WEBHOOK_CLIENT_STATE: "royal-leadgen-webhook"
  GRAPH_ADMIN_WEBHOOK_CLIENT_STATE: "royal-leadgen-admin-webhook"
  GRAPH_NOTIFICATION_URL: ${{ secrets.GRAPH_NOTIFICATION_URL }}
  GRAPH_SUBSCRIPTION_EXPIRATION_MINUTES: "60"
  GRAPH_ADMIN_SUBSCRIPTION_RESOURCE: ${{ secrets.GRAPH_ADMIN_SUBSCRIPTION_RESOURCE }}
  NEXT_PUBLIC_NOVU_APP_IDENTIFIER: ${{ secrets.NEXT_PUBLIC_NOVU_APP_IDENTIFIER }}
  NOVU_SECRET_KEY: ${{ secrets.NOVU_SECRET_KEY }}
  MISTRAL_AI_KEY: ${{ secrets.MISTRAL_AI_KEY }}
  AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
  SCRAPEDO_TOKEN: ${{ secrets.SCRAPEDO_TOKEN }}
  PUPPETEER_SKIP_DOWNLOAD: "true"
  XERO_CLIENT_ID: ${{ secrets.XERO_CLIENT_ID }}
  XERO_CLIENT_SECRET: ${{ secrets.XERO_CLIENT_SECRET }}
  XERO_REDIRECT_URI: ${{ secrets.XERO_REDIRECT_URI }}
  XERO_WEBHOOK_SECRET: ${{ secrets.XERO_WEBHOOK_SECRET }}
  XERO_SALES_ACCOUNT_CODE: ${{ secrets.XERO_SALES_ACCOUNT_CODE }}
  XERO_SALES_TAX_TYPE: ${{ secrets.XERO_SALES_TAX_TYPE }}

jobs:
  decide-deployment:
    name: Decide deployment
    if: inputs.deploy && contains(fromJSON('["main", "staging"]'), inputs.branch)
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decision.outputs.deploy }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
    steps:
      - name: Set deployment decision
        id: decision
        run: |
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "Deployment decision: ${{ inputs.branch }} deployment requested by Quality Checks."

  vercel-deploy-production:
    name: Deploy production
    if: needs.decide-deployment.outputs.deploy == 'true' && needs.decide-deployment.outputs.branch == 'main'
    needs: decide-deployment
    runs-on: ubuntu-latest
    environment: Preview
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.decide-deployment.outputs.sha }}
      - name: Setup project
        uses: ./.github/actions/setup
      - name: Restore Next.js build cache
        id: nextjs-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml', 'next.config.ts') }}-${{ needs.decide-deployment.outputs.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml', 'next.config.ts') }}-
      # `actions/cache/restore` succeeds whether or not it restored anything, so
      # a cold `vercel build` is otherwise invisible. Report which key was used.
      - name: Report the Next.js cache restore
        env:
          EXACT_HIT: ${{ steps.nextjs-cache.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.nextjs-cache.outputs.cache-matched-key }}
        run: |
          if [ "$EXACT_HIT" = "true" ]; then
            echo "Restored this commit's Next.js cache." >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$MATCHED_KEY" ]; then
            echo "::notice::Restored an older Next.js cache ($MATCHED_KEY); the build is warm but not exact."
            echo "Restored an older Next.js cache: \`$MATCHED_KEY\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No Next.js cache was restored; vercel build will run cold."
            echo "No Next.js cache was restored; this deployment builds cold." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run Prisma migrate
        env:
          PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK: "1"
        run: |
          export DATABASE_URL="$(node -e 'const url = new URL(process.env.DATABASE_URL); url.hostname = url.hostname.replace("-pooler.", "."); url.searchParams.delete("pgbouncer"); console.log(url.toString());')"
          pnpm prisma:migrate-deploy
      - name: Install Vercel CLI
        run: pnpm add -g vercel
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Vercel Project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  vercel-deploy-staging:
    name: Deploy staging
    if: needs.decide-deployment.outputs.deploy == 'true' && needs.decide-deployment.outputs.branch == 'staging'
    needs: decide-deployment
    runs-on: ubuntu-latest
    environment: Preview
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.decide-deployment.outputs.sha }}
      - name: Setup project
        uses: ./.github/actions/setup
      - name: Restore Next.js build cache
        id: nextjs-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml', 'next.config.ts') }}-${{ needs.decide-deployment.outputs.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml', 'next.config.ts') }}-
      # `actions/cache/restore` succeeds whether or not it restored anything, so
      # a cold `vercel build` is otherwise invisible. Report which key was used.
      - name: Report the Next.js cache restore
        env:
          EXACT_HIT: ${{ steps.nextjs-cache.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.nextjs-cache.outputs.cache-matched-key }}
        run: |
          if [ "$EXACT_HIT" = "true" ]; then
            echo "Restored this commit's Next.js cache." >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$MATCHED_KEY" ]; then
            echo "::notice::Restored an older Next.js cache ($MATCHED_KEY); the build is warm but not exact."
            echo "Restored an older Next.js cache: \`$MATCHED_KEY\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No Next.js cache was restored; vercel build will run cold."
            echo "No Next.js cache was restored; this deployment builds cold." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run Prisma migrate
        env:
          PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK: "1"
        run: |
          export DATABASE_URL="$(node -e 'const url = new URL(process.env.DATABASE_URL); url.hostname = url.hostname.replace("-pooler.", "."); url.searchParams.delete("pgbouncer"); console.log(url.toString());')"
          pnpm prisma:migrate-deploy
      - name: Install Vercel CLI
        run: pnpm add -g vercel
      - name: Pull Preview Environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Vercel Project for Staging
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to Vercel for Staging
        run: >-
          vercel deploy --prebuilt
          --meta githubDeployment=1
          --meta githubCommitRef=${{ needs.decide-deployment.outputs.branch }}
          --meta githubCommitSha=${{ needs.decide-deployment.outputs.sha }}
          --token=${{ secrets.VERCEL_TOKEN }}
