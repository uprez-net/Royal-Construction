name: Tests, Quality Checks, and Vercel Deployment

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

# Supersede an in-flight run for the same PR, but never cancel a push to
# main/staging -- those runs deploy, so they always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ─── Shared env vars (referenced in all jobs) ────────────────────────────────
env:
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
  NEXT_PUBLIC_CLERK_SIGN_IN_URL: "/sign-in"
  NEXT_PUBLIC_CLERK_SIGN_UP_URL: "/sign-up"
  BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
  GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
  GEOSCAPE_API_KEY: ${{ secrets.GEOSCAPE_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  BUSINESS_EMAIL: "info@royalconstructions.com.au"
  BUSINESS_ADMIN_EMAIL: "admin@royalconstructions.com.au"
  GRAPH_SENDER_UPN: "info@royalconstructions.com.au"
  GRAPH_ADMIN_SENDER_UPN: "admin@royalconstructions.com.au"
  GRAPH_ADMIN_MAIL_CC: "nabeel.wasif+admin@uprez.net"
  GRAPH_MODE: "app-only"
  WEBHOOK_PATH: "/api/graph/notifications"
  WEBHOOK_PORT: "3000"
  GRAPH_WEBHOOK_CLIENT_STATE: "royal-leadgen-webhook"
  GRAPH_ADMIN_WEBHOOK_CLIENT_STATE: "royal-leadgen-admin-webhook"
  GRAPH_NOTIFICATION_URL: ${{ secrets.GRAPH_NOTIFICATION_URL }}
  GRAPH_SUBSCRIPTION_EXPIRATION_MINUTES: "60"
  GRAPH_ADMIN_SUBSCRIPTION_RESOURCE: ${{ secrets.GRAPH_ADMIN_SUBSCRIPTION_RESOURCE }}
  NEXT_PUBLIC_NOVU_APP_IDENTIFIER: ${{ secrets.NEXT_PUBLIC_NOVU_APP_IDENTIFIER }}
  NOVU_SECRET_KEY: ${{ secrets.NOVU_SECRET_KEY }}
  MISTRAL_AI_KEY: ${{ secrets.MISTRAL_AI_KEY }}
  AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
  SCRAPEDO_TOKEN: ${{ secrets.SCRAPEDO_TOKEN }}
  REDIS_URL: ${{ secrets.REDIS_URL }}
  # `puppeteer`'s postinstall downloads a ~170MB Chrome build on every install,
  # in every job. Nothing in CI launches a browser: production PDF rendering
  # uses puppeteer-core + @sparticuz/chromium (see lib/utils/generatePDF.ts, the
  # full `puppeteer` package is the NODE_ENV=development branch only), and both
  # browser tests -- tests/offer/offer-document-print-pages.test.ts and
  # tests/offer/offer-tender-print-parity.test.ts -- are excluded from
  # `test:unit`. If either is ever folded into CI, drop this from the `test` job
  # below and cache ~/.cache/puppeteer there instead.
  PUPPETEER_SKIP_DOWNLOAD: "true"
  # PlaceHolder-Keys
  XERO_CLIENT_ID: ${{ secrets.XERO_CLIENT_ID }}
  XERO_CLIENT_SECRET: ${{ secrets.XERO_CLIENT_SECRET }}
  XERO_REDIRECT_URI: ${{ secrets.XERO_REDIRECT_URI }}
  XERO_WEBHOOK_SECRET: ${{ secrets.XERO_WEBHOOK_SECRET }}
  XERO_SALES_ACCOUNT_CODE: ${{ secrets.XERO_SALES_ACCOUNT_CODE }}
  XERO_SALES_TAX_TYPE: ${{ secrets.XERO_SALES_TAX_TYPE }}

jobs:
  # ─── Checks ────────────────────────────────────────────────────────────────
  # lint / typecheck / test / build have no dependency on each other, so they
  # run as four parallel jobs and the wall clock is the slowest one rather than
  # the sum. `quality-checks` below fans them back in, so branch protection
  # keeps working against a single required check.

  lint:
    runs-on: ubuntu-latest
    environment: Preview

    env:
      NODE_ENV: "test"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup project
        uses: ./.github/actions/setup
        with:
          # eslint-config-next enables no type-aware rules, so ESLint never
          # needs the generated Prisma client.
          prisma: "false"

      # ESLint spends ~5s loading its config and plugins and ~20s on the 706
      # files it lints. The cache reduces the second part to the files that
      # actually changed. `content` strategy, not the default `metadata`: a
      # fresh checkout rewrites every mtime, so metadata would always miss.
      - name: Cache ESLint results
        uses: actions/cache@v5
        with:
          path: .eslintcache
          key: ${{ runner.os }}-eslint-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-eslint-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-

      - name: Run lint
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    environment: Preview

    env:
      NODE_ENV: "test"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup project
        uses: ./.github/actions/setup

      # tsconfig.json already sets `incremental: true`, but the .tsbuildinfo it
      # writes is gitignored, so CI threw it away every run and paid for a cold
      # program each time (~20s vs ~8s warm).
      - name: Cache TypeScript build info
        uses: actions/cache@v5
        with:
          path: tsconfig.tsbuildinfo
          key: ${{ runner.os }}-tsbuildinfo-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-tsbuildinfo-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json') }}-

      - name: Run typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    environment: Preview

    env:
      NODE_ENV: "test"
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup project
        uses: ./.github/actions/setup

      # `test:unit` is the whole suite minus the two tests that launch real
      # headless Chromium -- offer-document-print-pages and
      # offer-tender-print-parity. Neither has ever executed in CI (Chrome is
      # not installed; see PUPPETEER_SKIP_DOWNLOAD above). Folding them in is a
      # deliberate follow-up: they fail rather than skip by design, so a launch
      # problem here would block unrelated PRs.
      #
      # Their cheap half still runs: offer-tender-template-parity asserts the
      # same tender from its HTML alone -- tokens, geometry percentages, the
      # DocuSign anchors and the injection guard -- and is included here.
      - name: Run unit tests
        run: pnpm test:unit

  build:
    runs-on: ubuntu-latest
    environment: Preview

    env:
      NODE_ENV: "test"
      # `next build` runs the project-local `tsc` itself, which is exactly the
      # work the `typecheck` job above does. Skipping it here keeps ~18s of
      # duplicated type checking off this job while the `typecheck` job still
      # gates the deploy. Both jobs are required by `quality-checks`, so type
      # errors still fail the run -- and `vercel build` on the deploy path does
      # not set this, so the deployed artifact is type-checked as well.
      SKIP_BUILD_TYPECHECK: "1"
      # Guardrail: the build check must NOT depend on the database.
      # Under Next 16 Cache Components a `'use cache'` fetcher called in a page
      # body is prefilled during `next build`, which runs its DB query at build
      # time -- and CI can't reliably reach Neon, so these builds flaked on
      # ETIMEDOUT. An unreachable host makes any build-time DB access fail the PR
      # here (fast + deterministic) instead of resurfacing on staging. DB reads
      # belong at request time (connection() / <Suspense>). Do NOT restore a real
      # DATABASE_URL to "fix" a build failure -- fix the page instead. `prisma
      # generate` only needs the var to be set, not reachable; the deploy jobs
      # below use the real secret for `prisma migrate deploy`.
      DATABASE_URL: "postgresql://build:noconnect@127.0.0.1:1/noop"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup project
        uses: ./.github/actions/setup

      # Turbopack's persistent FileSystem cache (on by default since Next
      # 16.3) lives in .next/cache/turbopack and takes the compile step from
      # ~20s cold to ~3s warm.
      #
      # Restore only -- the save is a separate step below that runs on pushes
      # to main/staging. The cache is ~480MB (~375MB packed), so writing a new
      # entry on every PR would spend more time uploading than the warm compile
      # saves, and would churn the 10GB repo cache budget (evicting the pnpm
      # store cache, which every job depends on). Pushes write one entry that
      # both the next run and this run's deploy job read.
      #
      # The key hashes only the lockfile and next.config.ts -- explicit paths,
      # not a `**/*.ts` glob. The old glob walked node_modules in the deploy
      # jobs (125k files) and, because it ran there *after* install, produced a
      # different digest than the checks job, so the deploy's restore could
      # never hit.
      - name: Restore Next.js build cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml', 'next.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml', 'next.config.ts') }}-

      - name: Build project (must not query the DB)
        run: pnpm build

      - name: Save Next.js build cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml', 'next.config.ts') }}-${{ github.sha }}

  # Fan-in so branch protection can keep requiring a single `quality-checks`
  # check. It passes only when all four checks above pass.
  quality-checks:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build]
    if: always()
    steps:
      - name: Verify check results
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "One or more checks did not succeed."
          exit 1
      - name: All checks passed
        run: echo "lint, typecheck, tests and build all passed."

  # ─── Deploy ────────────────────────────────────────────────────────────────

  vercel-deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: quality-checks
    environment: Preview
    concurrency:
      group: vercel-deploy-production
      cancel-in-progress: false

    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Also runs `prisma generate`, which this job used to do as its own step
      # after the migrate.
      - name: Setup project
        uses: ./.github/actions/setup

      # Exact-key hit on the entry the `build` job saved earlier in this same
      # run, so `vercel build` starts with a warm Turbopack cache.
      - name: Restore Next.js build cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml', 'next.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml', 'next.config.ts') }}-

      - name: Run Prisma migrate
        env:
          PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK: "1"
        run: |
          export DATABASE_URL="$(node -e 'const url = new URL(process.env.DATABASE_URL); url.hostname = url.hostname.replace("-pooler.", "."); url.searchParams.delete("pgbouncer"); console.log(url.toString());')"
          pnpm prisma:migrate-deploy

      - name: Install Vercel CLI
        run: pnpm add -g vercel

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel Project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  vercel-deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    needs: quality-checks
    environment: Preview
    concurrency:
      group: vercel-deploy-staging
      cancel-in-progress: false

    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Also runs `prisma generate`, which this job used to do as its own step
      # after the migrate.
      - name: Setup project
        uses: ./.github/actions/setup

      # Exact-key hit on the entry the `build` job saved earlier in this same
      # run, so `vercel build` starts with a warm Turbopack cache.
      - name: Restore Next.js build cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml', 'next.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml', 'next.config.ts') }}-

      - name: Run Prisma migrate
        env:
          PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK: "1"
        run: |
          export DATABASE_URL="$(node -e 'const url = new URL(process.env.DATABASE_URL); url.hostname = url.hostname.replace("-pooler.", "."); url.searchParams.delete("pgbouncer"); console.log(url.toString());')"
          pnpm prisma:migrate-deploy

      - name: Install Vercel CLI
        run: pnpm add -g vercel

      - name: Pull Preview Environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel Project for Staging
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel for Staging
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
